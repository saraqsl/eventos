<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARA - Noche de los Museos 2026</title>
<style>
*{box-sizing:border-box}body{font-family:"Courier New",monospace;background:#e5ebf0;display:flex;flex-direction:column;align-items:center;margin:0;padding:20px}h1{color:#002b5c;text-align:center;text-transform:uppercase}input,button{padding:10px;margin:6px 0;border-radius:6px;border:1px solid #ccc;width:100%;max-width:300px;font-family:inherit}button{cursor:pointer;background:#003366;color:white;border:none;text-transform:uppercase;font-weight:bold}button:hover{background:#0056b3}button:disabled{opacity:.6;cursor:wait}.qslCard{margin-bottom:30px;text-align:center;background:white;padding:15px;border-radius:8px;border:1px solid #ddd;width:100%;max-width:820px}canvas{display:block;margin:10px auto;border:2px solid #003366;box-shadow:0 3px 8px #0005;height:auto;width:100%;max-width:400px}#accionesDescarga{display:none;margin-bottom:20px}#qslContainer{width:100%;max-width:820px}#estado{text-align:center;max-width:820px} .error{color:#9c2020}
</style>
</head>
<body>
<h1>⚓ Noche de los Museos</h1>
<p>LU2CN · LU7AMH · LU1ARA — SARA</p>
<input type="text" id="sdVisitante" placeholder="INGRESE SU SEÑAL (EJ: LU9MAH)" aria-label="Señal distintiva" autocomplete="off">
<button id="buscar">🔍 BUSCAR CONTACTOS</button>
<p id="estado" role="status" aria-live="polite"></p>
<div id="accionesDescarga"><button id="descargarTodo" style="background:#28a745">📦 DESCARGAR TODO (.ZIP)</button></div>
<div id="qslContainer"></div>
<script>
'use strict';
const API_URL='https://script.google.com/macros/s/AKfycbxZsk3x1IAodL4mo1FxPLnCcz6z_Nc6KSdcHVKw5ZNwFkNI178rVrd9MVWoRqDjrdzA1g/exec';
const MAPA_QSLS={LU7AMH:'qsl1.png',LU1ARA:'qsl2.png',LU2CN:'qsl3.png'};
const $=id=>document.getElementById(id);
const norm=v=>String(v??'').trim().toUpperCase();
const seguro=v=>String(v).replace(/[^A-Za-z0-9_-]/g,'_');
let canvasesGenerados=[];
function estado(texto,error=false){$('estado').textContent=texto;$('estado').classList.toggle('error',error)}
async function verQSL(){
 const sd=norm($('sdVisitante').value);if(!sd){estado('Ingrese su señal.',true);return}
 $('sdVisitante').value=sd;$('buscar').disabled=true;$('qslContainer').replaceChildren();$('accionesDescarga').style.display='none';canvasesGenerados=[];estado('Buscando contactos...');
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),30000);
 try{
  const res=await fetch(API_URL,{signal:controller.signal});if(!res.ok)throw new Error('El servidor respondió con error HTTP '+res.status+'.');
  let data;try{data=await res.json()}catch(e){if(e.name==='AbortError')throw e;throw new Error('El servidor no devolvió un JSON válido. Revisá la publicación del Apps Script.')}
  if(!Array.isArray(data))throw new Error('Se esperaba una lista de contactos en el JSON.');
  const contactos=data.filter(c=>c&&norm(c.call)===sd&&Object.hasOwn(MAPA_QSLS,norm(c.owner)));
  if(!contactos.length){estado('No se encontraron contactos con LU2CN, LU7AMH o LU1ARA para '+sd+'.');return}
  let fallidas=0;
  for(const [i,c] of contactos.entries()){
   estado('Generando QSL '+(i+1)+' de '+contactos.length+'...');
   try{await generarQSL(norm(c.owner),c,i+1)}catch(e){fallidas++;const aviso=document.createElement('p');aviso.className='error';aviso.textContent=e.message;$('qslContainer').append(aviso)}
  }
  estado('QSL disponibles: '+canvasesGenerados.length+'.'+(fallidas?' No se pudieron generar '+fallidas+' QSL; revisá las imágenes indicadas.':''),fallidas>0);
  $('accionesDescarga').style.display=canvasesGenerados.length?'block':'none';
 }catch(e){estado(e.name==='AbortError'?'El servidor demoró demasiado. Volvé a intentar.':e.message==='Failed to fetch'?'No se pudo conectar con el servidor. Revisá la conexión y el acceso público del Apps Script.':e.message,true)}
 finally{clearTimeout(timeout);$('buscar').disabled=false}
}
function cargarImagen(ruta){return new Promise((resolve,reject)=>{
 const img=new Image();const timer=setTimeout(()=>{img.onload=null;img.onerror=null;reject(new Error('La imagen '+ruta+' demoró demasiado en cargar.'))},15000);
 img.onload=()=>{clearTimeout(timer);resolve(img)};img.onerror=()=>{clearTimeout(timer);reject(new Error('No se pudo cargar '+ruta+'. Debe estar en la misma carpeta que este HTML.'))};img.src=ruta;
})}
async function generarQSL(activador,c,indice){
 const img=await cargarImagen(MAPA_QSLS[activador]);const canvas=document.createElement('canvas');
 // Usar las dimensiones originales evita comprimir o estirar la plantilla.
 canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
 const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);
 // La señal del activador ya está incluida en la imagen.
 // Datos centrados en la franja inferior, a la derecha de la señal impresa.
 const x=canvas.width*0.575;
 const anchoTexto=canvas.width*0.80;
 ctx.font='bold '+Math.round(canvas.width*0.030)+'px Arial';
 ctx.fillStyle='#fcfafb';ctx.textAlign='center';ctx.textBaseline='middle';
 function escribirDato(texto,y){
  ctx.save();let size=Math.round(canvas.width*0.030);
  while(ctx.measureText(texto).width>anchoTexto&&size>10){size--;ctx.font='bold '+size+'px Arial'}
  ctx.fillText(texto,x,canvas.height*y);ctx.restore();
 }
 escribirDato('QSO con '+norm(c.call)+' Fecha: '+String(c.date??''),0.900);
 escribirDato(String(c.time??'')+' UTC | '+String(c.band??'')+' | '+String(c.mode??''),0.958);
 const name=seguro(activador+'_'+norm(c.call)+'_'+String(c.date??'')+'_'+String(c.time??'')+'_'+indice);
 const card=document.createElement('div');card.className='qslCard';card.append(canvas);const btn=document.createElement('button');btn.textContent='⬇️ DESCARGAR QSL';btn.onclick=()=>{try{descargarIndividual(canvas,name)}catch(e){estado('No se pudo descargar la QSL: '+e.message,true)}};card.append(btn);$('qslContainer').append(card);canvasesGenerados.push({canvas,name});
}
function descargarBlob(blob,nombre){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=nombre;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function descargarIndividual(canvas,name){const a=document.createElement('a');a.download=name+'.jpg';a.href=canvas.toDataURL('image/jpeg',.95);document.body.append(a);a.click();a.remove()}
let zipPromise;
function cargarZIP(){if(window.JSZip)return Promise.resolve();if(zipPromise)return zipPromise;zipPromise=new Promise((resolve,reject)=>{const s=document.createElement('script');const timer=setTimeout(()=>{s.remove();reject(new Error('La librería ZIP demoró demasiado.'))},15000);s.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';s.onload=()=>{clearTimeout(timer);window.JSZip?resolve():reject(new Error('No se pudo iniciar la librería ZIP.'))};s.onerror=()=>{clearTimeout(timer);s.remove();reject(new Error('No se pudo cargar la librería ZIP. Podés descargar cada QSL individualmente.'))};document.head.append(s)}).catch(e=>{zipPromise=null;throw e});return zipPromise}
async function descargarTodas(){const btn=$('descargarTodo');btn.disabled=true;$('buscar').disabled=true;try{await cargarZIP();const zip=new JSZip();for(const c of canvasesGenerados)zip.file(c.name+'.jpg',c.canvas.toDataURL('image/jpeg',.95).split(',')[1],{base64:true});descargarBlob(await zip.generateAsync({type:'blob'}),'mis_qsls_museos26.zip')}catch(e){estado(e.message,true)}finally{btn.disabled=false;$('buscar').disabled=false}}
$('buscar').addEventListener('click',verQSL);$('descargarTodo').addEventListener('click',descargarTodas);$('sdVisitante').addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('buscar').disabled)verQSL()});
const sdURL=new URLSearchParams(location.search).get('sd');if(sdURL){$('sdVisitante').value=sdURL;verQSL()}
</script>
</body>
</html>
