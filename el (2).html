<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta de alquiler y consumos</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2312344d'/%3E%3Cpath d='M6 16L16 7L26 16V26H6Z' fill='white'/%3E%3C/svg%3E"><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#152a40;background:#edf3f8;font-size:16px;line-height:1.5}*{box-sizing:border-box}body{margin:0}header{background:#12344d;color:white;padding:20px max(24px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font-size:1.2rem}main{max-width:1080px;margin:32px auto;padding:0 24px}h1{font-size:1.8rem;margin:0 0 20px}h2{font-size:1.15rem;margin:0 0 16px}h3{font-size:1rem}p{margin:8px 0 16px}.card{background:white;border:1px solid #cfdae4;border-radius:12px;padding:24px;margin-bottom:20px}.login{max-width:440px;margin:64px auto}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.amount{font-size:2rem;font-weight:750;letter-spacing:-.03em}.summary{background:#12344d;color:white}.summary .amount{font-size:2.6rem}.muted{color:#526579}.summary .muted{color:#d0dfe9}label{display:block;margin-bottom:16px;font-weight:600;font-size:.95rem}input,select{font:inherit;color:inherit;width:100%;margin-top:6px;padding:11px 12px;border:1px solid #9eafbe;border-radius:6px;background:white}button,.button{font:inherit;font-weight:650;border:0;border-radius:6px;padding:12px 18px;background:#146c77;color:white;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.55;cursor:wait}.secondary{background:#dce8ef;color:#16354e}.textbutton{background:transparent;color:inherit;text-decoration:underline}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.notice{padding:16px;border-radius:8px;background:#e3f3f5;color:#125764;margin-bottom:20px}.danger{background:#ffe7e7;color:#a11e28;border:1px solid #f4afb4}.badge{display:inline-block;padding:5px 10px;background:#e2edf4;border-radius:6px;font-weight:650}.paid{background:#dcf3e7;color:#155b37}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:12px 10px;border-bottom:1px solid #dce4ec}th{font-size:.9rem;color:#526579}.scroll{overflow:auto}.small{font-size:.9rem}details{border-top:1px solid #dce4ec;padding-top:16px;margin-top:16px}summary{cursor:pointer;font-weight:650}.hidden,[hidden]{display:none!important}#message{position:sticky;top:8px;z-index:5}footer{padding:24px;text-align:center;color:#526579;font-size:.9rem}a{color:#146c77}:focus-visible{outline:3px solid #e39a26;outline-offset:3px}@media(max-width:720px){main{padding:0 16px;margin-top:24px}.grid,.two{grid-template-columns:1fr}.card{padding:20px}.amount{font-size:1.7rem}header{padding:16px}h1{font-size:1.5rem}}@media print{header button,.actions,#login,footer{display:none}body{background:white}.card{break-inside:avoid}}
</style></head><body><header><strong>Mis consumos y alquiler</strong><button id="logout" class="textbutton" hidden>Cerrar sesión</button></header><main><div id="message" role="status" aria-live="polite" hidden></div><section id="login" class="card login"><h1>Consultar mi casa</h1><p class="muted">Ingresá con el usuario y la clave que te entregó el propietario.</p><form id="loginform"><label>Usuario<input id="user" autocomplete="username" required></label><label>Clave<input id="key" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form><button id="demo" class="textbutton" style="margin-top:12px">Ver ejemplo</button></section><section id="account" hidden></section></main><footer>Importes en pesos argentinos · Datos de la hoja cobros</footer><script>/* Conexión de lectura: Google Sheets, pestaña cobros. */
const SHEET_ID='1RJjtSVZtmxild78h-18RHnMh5SPZHy2gb6pMzs2aT3o';
const SHEET_GID='202648286';
// Si se publica únicamente la pestaña cobros como CSV, pegar aquí su enlace.
const PUBLISHED_CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTb499rWGU-dlsKGUFgHR627tih_tMaKErsk7GpRiaQH5ME5VeWwUHGxF04rtwejuoMMZUp8kgbd8Oq/pub?gid=202648286&single=true&output=csv';
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n);
const norm=s=>String(s??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date());
const monthName=s=>new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(s+'-01T12:00:00Z'));
let rows=[], identity=null, demonstration=false;
function message(s,bad=false){$('message').hidden=!s;$('message').className='notice'+(bad?' danger':'');$('message').textContent=s;}
function numberValue(s){if(typeof s==='number')return s;if(s==null||s==='')return 0;let t=String(s).replace(/[\s$]/g,'');if(t.includes(','))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');const n=Number(t);if(!Number.isFinite(n)||n<0)throw Error('Hay un importe o consumo inválido en la planilla: '+String(s));return n;}
function dateValue(s){const raw=String(s||'').trim();const g=/^Date\((\d{4}),(\d{1,2}),(\d{1,2})\)$/.exec(raw);if(g)return g[1]+'-'+String(+g[2]+1).padStart(2,'0')+'-'+g[3].padStart(2,'0');if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;const a=/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/.exec(raw);return a?a[3]+'-'+a[2].padStart(2,'0')+'-'+a[1].padStart(2,'0'):'';}
function monthValue(s){const d=dateValue(s);if(d)return d.slice(0,7);const a=/^(\d{4})[-/](\d{1,2})$/.exec(String(s).trim());const b=/^(\d{1,2})[-/](\d{4})$/.exec(String(s).trim());const out=a?a[1]+'-'+a[2].padStart(2,'0'):b?b[2]+'-'+b[1].padStart(2,'0'):'';if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(out))throw Error('El mes debe estar escrito como 2026-10 o ser una fecha válida.');return out;}
function csvTable(text){const lines=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);lines.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('El archivo CSV está incompleto.');if(cell||row.length){row.push(cell);lines.push(row)}const headers=lines.shift()||[];return {cols:headers.map(label=>({label:label.replace(/^\uFEFF/,'')})),rows:lines.map(r=>({c:r.map(v=>({v}))}))};}
async function publishedSheet(){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);try{const response=await fetch(PUBLISHED_CSV_URL,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('No se pudo leer el CSV publicado.');const text=await response.text();if(/^\s*</.test(text))throw Error('El enlace debe ser el de cobros publicado como CSV.');return parseTable(csvTable(text));}finally{clearTimeout(timer)}}
async function loadSheet(){const table=await jsonpTable();if(norm(table.cols[0]?.label)==='columna'){const labels=['casa','usuario','clave','mes','periodo','fechapago','fechadepago','pagosdetalle','detallepagos','enlacepago','linkpago'];const indices=table.rows.map((r,i)=>labels.includes(norm(r.c[0]?.v))?i:-1).filter(i=>i>=0);await Promise.all(indices.map(async i=>{const rowTable=await jsonpTable('A'+(i+2)+':ZZ'+(i+2));const cells=rowTable.rows?.[0]?.c;if(!cells)throw Error('No se pudo leer uno de los campos de cobros.');table.rows[i].c=cells.map(c=>c?{...c}:null);if(['mes','periodo','fechapago','fechadepago'].includes(norm(cells[0]?.v)))for(let j=1;j<table.rows[i].c.length;j++){const c=table.rows[i].c[j];if(c&&typeof c.v==='number'&&c.f)c.v=c.f;}}));}return parseTable(table);}
function jsonpTable(range=''){return new Promise((resolve,reject)=>{const callback='cobrosResponse'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const clean=()=>{clearTimeout(timer);script.remove();delete window[callback]};const timer=setTimeout(()=>{clean();reject(Error('Google no respondió. Revisá la conexión y que cobros siga compartida como Lector.'))},20000);window[callback]=r=>{clean();if(r.status!=='ok'){reject(Error('Google no permite leer cobros. En Compartir, elegí Cualquier persona con el enlace y Lector.'));return}resolve(r.table)};script.onerror=()=>{clean();reject(Error('No se pudo leer Google Sheets. Verificá el permiso de lectura y volvé a intentar.'))};script.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?gid='+SHEET_GID+'&headers='+(range?'0':'1')+(range?'&range='+encodeURIComponent(range):'')+'&tqx='+encodeURIComponent('out:json;responseHandler:'+callback)+'&tq='+encodeURIComponent('select *');document.head.appendChild(script)});}
function parseTable(table){if(norm(table.cols[0]?.label)==='columna'){const source=table;table={cols:source.rows.filter(r=>r.c[0]?.v).map(r=>({label:String(r.c[0].v)})),rows:source.cols.slice(1).map((_,i)=>({c:source.rows.filter(r=>r.c[0]?.v).map(r=>r.c[i+1]||{v:''})}))};table.rows=table.rows.filter(r=>r.c.some(c=>c?.v!==''&&c?.v!=null));}const headers=table.cols.map(c=>norm(c.label));const aliases={house:['casa'],user:['usuario'],key:['clave','contrasena'],month:['mes','periodo'],rent:['alquiler'],light:['consumoluz','luzkwh','consumoluzkwh'],lightPrice:['preciokwh','preciokwhluz'],gas:['consumogas','gasm3','consumogasm3'],gasPrice:['preciom3','preciom3gas'],paid:['pagado','importeabonado'],paidDate:['fechapago','fechadepago'],payments:['pagosdetalle','detallepagos'],link:['enlacepago','linkpago']};const index={};for(const [k,names]of Object.entries(aliases))index[k]=headers.findIndex(h=>names.includes(h));const required=['house','user','key','month','rent','light','lightPrice','gas','gasPrice','paid'];const missing=required.filter(k=>index[k]<0);if(missing.length)throw Error('Faltan columnas. Usá: Casa, Usuario, Clave, Mes, Alquiler, Consumo luz, Precio kWh, Consumo gas, Precio m³, Pagado.');
 const result=[];for(const source of table.rows){const val=k=>index[k]<0?'':source.c[index[k]]?.v??'';const text=k=>index[k]<0?'':source.c[index[k]]?.f??val(k);if(!val('user')&&!val('house'))continue;const r={house:String(text('house')),user:String(text('user')).trim(),key:String(text('key')).trim(),month:monthValue(val('month')),payments:[],link:String(val('link'))};for(const k of ['rent','light','lightPrice','gas','gasPrice','paid']){if(k!=='paid'&&(val(k)===''||val(k)==null))r.incomplete=true;r[k]=numberValue(val(k));}r.base=Math.round((r.rent+Math.round(r.light*r.lightPrice*100)/100+Math.round(r.gas*r.gasPrice*100)/100)*100)/100;
 const detail=String(val('payments')||'').trim();if(detail){for(const piece of detail.split(';')){const split=piece.trim().split('=');const date=dateValue(split[0]);if(split.length!==2||!date)throw Error('Pagos detalle debe tener este formato: 2026-10-04=50000;2026-10-10=20000');r.payments.push({date,amount:numberValue(split[1])});}const sum=r.payments.reduce((s,p)=>s+p.amount,0);if(Math.abs(sum-r.paid)>.01)throw Error('Pagado no coincide con la suma de Pagos detalle para '+r.house+'.');}else if(r.paid>0){const date=dateValue(val('paidDate'));if(date)r.payments=[{date,amount:r.paid}];else r.missingDate=true;}
 for(const p of r.payments){if(p.date<r.month+'-01'||p.date>today())throw Error('Revisá la fecha del pago de '+r.house+'.');if(!p.amount)throw Error('Los pagos deben tener un importe positivo.');}
 if(!r.user||!r.key)throw Error('Cada fila debe tener usuario y clave.');result.push(r);}
 const seen=new Set();for(const r of result){const id=norm(r.user)+'|'+r.month;if(seen.has(id))throw Error('Hay más de una fila para el mismo usuario y mes.');seen.add(id);}return result;}
function calculate(r,asOf=today()){if(r.incomplete)throw Error('Faltan importes o consumos para '+r.house+'. El propietario debe completar las celdas vacías en cobros (o escribir 0 si corresponde).');if(r.missingDate)return {base:r.base,charges:null,paid:r.paid,total:Math.max(0,r.base-r.paid),status:r.paid>=r.base?'Pago por verificar':'Pago parcial',unconfirmed:true};const dn=s=>Math.floor(Date.parse(s+'T00:00:00Z')/86400000);let principal=Math.round(r.base*100),charges=0,generated=0,paid=0,tier=0,i=0;const ps=[...r.payments].sort((a,b)=>a.date.localeCompare(b.date));for(let d=dn(r.month+'-01'),last=dn(asOf);d<=last;d++){const age=d-dn(r.month+'-01')+1,rate=age>=10?.10:age>=6?.03:0;let extra=0;if(rate>tier){extra+=Math.round(principal*(rate-tier));tier=rate}if(age>=15)extra+=Math.round(principal*.002);charges+=extra;generated+=extra;while(i<ps.length&&dn(ps[i].date)<=d){let amount=Math.round(ps[i++].amount*100);paid+=amount;const toCharges=Math.min(amount,charges);charges-=toCharges;amount-=toCharges;if(amount>principal)throw Error('El pago registrado supera el saldo de esa fecha para '+r.house+'. Revisá la planilla.');principal-=amount;}}return {base:r.base,charges:generated/100,paid:paid/100,total:(principal+charges)/100,status:principal+charges===0?'Pagado':paid?'Pago parcial':'Pendiente',age:dn(asOf)-dn(r.month+'-01')+1};}
function safeLink(s){try{const u=new URL(s);return u.protocol==='https:'?u.href:''}catch{return ''}}
function render(){const mine=rows.filter(r=>norm(r.user)===identity.user&&r.key===identity.key&&r.month<=today().slice(0,7)).sort((a,b)=>b.month.localeCompare(a.month));if(!mine.length)throw Error('Este usuario todavía no tiene períodos cargados.');const currentMonth=today().slice(0,7),r=mine.find(r=>r.month===currentMonth)||mine[0],c=calculate(r);let min=new Date(currentMonth+'-01T12:00:00Z');min.setUTCMonth(min.getUTCMonth()-3);const floor=min.toISOString().slice(0,7);const previous=mine.filter(x=>x.month<currentMonth&&x.month>=floor);const due=r.month+'-05',link=safeLink(r.link);
 $('login').hidden=true;$('account').hidden=false;$('logout').hidden=false;$('account').innerHTML=`${demonstration?'<div class="notice"><strong>Demostración con datos ficticios.</strong> Todavía no está leyendo tu planilla.</div>':''}<div class="actions" style="justify-content:space-between;margin-bottom:20px"><h1 style="margin:0">${escapeHtml(r.house)}</h1><button id="refresh" class="secondary">Actualizar datos</button></div><p class="muted">${escapeHtml(monthName(r.month))}${r.month!==currentMonth?' · Último período cargado':''}</p><div class="two"><section class="card summary"><h2>${c.unconfirmed?'Saldo sin recargos confirmados':'Saldo a pagar'}</h2><div class="amount">${money(c.total)}</div><p><span class="badge ${c.status==='Pagado'?'paid':''}">${c.status}</span></p><p class="muted">Vencimiento sin recargo: ${due.split('-').reverse().join('/')}</p></section><section class="card"><h2>Detalle del mes</h2><table><tbody><tr><td>Alquiler</td><td>${money(r.rent)}</td></tr><tr><td>Luz</td><td>${money(r.light*r.lightPrice)}</td></tr><tr><td>Gas</td><td>${money(r.gas*r.gasPrice)}</td></tr><tr><td>Importe original</td><td>${money(c.base)}</td></tr><tr><td>Recargos generados</td><td>${c.charges===null?'—':money(c.charges)}</td></tr><tr><td>Pagos recibidos</td><td>${money(c.paid)}</td></tr></tbody></table></section></div>${c.unconfirmed?'<div class="notice">El pago parcial está registrado. Falta la fecha del pago para confirmar los recargos y el saldo final.</div>':''}${c.total>0&&today()>=r.month+'-15'?'<div class="notice danger"><strong>DEUDA VENCIDA. Regularice su pago.</strong><br>Desde el día 15 se aplica un interés diario del 0,2 % sobre el capital pendiente, además del recargo del 10 %.</div>':''}${c.total>0&&link&&!demonstration?`<section class="card"><a class="button" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">Pagar online</a><p class="small muted">Verificá el importe y el destinatario. El pago se verá cuando el propietario lo registre.</p></section>`:''}<section class="card"><h2>Historial de los tres meses anteriores</h2>${previous.length?'<div class="scroll"><table><thead><tr><th>Mes</th><th>Luz</th><th>Gas</th><th>Original</th><th>Pagado</th><th>Saldo hoy</th><th>Estado</th></tr></thead><tbody>'+previous.map(x=>{const t=calculate(x);return `<tr><td>${escapeHtml(monthName(x.month))}</td><td>${money(x.light*x.lightPrice)}</td><td>${money(x.gas*x.gasPrice)}</td><td>${money(t.base)}</td><td>${money(t.paid)}</td><td>${money(t.total)}${t.unconfirmed?' + recargos por confirmar':''}</td><td>${t.status}</td></tr>`}).join('')+'</tbody></table></div>':'<p class="muted">No hay datos cargados para los tres meses anteriores.</p>'}</section><section class="card"><h2>Vencimientos</h2><table><tbody><tr><td>Del 1 al 5</td><td>Sin recargo</td></tr><tr><td>Del 6 al 9</td><td>3 %</td></tr><tr><td>Del 10 al 14</td><td>10 %</td></tr><tr><td>Desde el 15</td><td>10 % + 0,2 % diario</td></tr></tbody></table><p class="small muted">El 10 % reemplaza al 3 %. Los recargos se aplican al capital pendiente de alquiler, luz y gas, sin interés sobre intereses. Los pagos cubren primero recargos y luego capital. El día 15 cuenta como el primer día de interés diario.</p></section><p class="small muted">Última consulta: ${new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short',timeZone:'America/Argentina/Buenos_Aires'}).format(new Date())}</p>`;
 $('refresh').onclick=async e=>{e.target.disabled=true;try{if(!demonstration)rows=await loadSheet();render();message('Datos actualizados.')}catch(err){message(err.message,true);e.target.disabled=false;}};
}
$('loginform').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;message('Consultando la hoja cobros…');try{rows=await loadSheet();const user=norm($('user').value),key=$('key').value.trim();if(!rows.some(r=>norm(r.user)===user&&r.key===key))throw Error('Usuario o clave incorrectos.');identity={user,key};demonstration=false;render();$('key').value='';message('')}catch(err){message(err.message,true)}finally{button.disabled=false}};
$('logout').onclick=()=>{identity=null;rows=[];$('account').innerHTML='';$('account').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('key').value='';message('')};
$('demo').onclick=()=>{const m=today().slice(0,7);rows=[];for(let i=0;i<4;i++){const date=new Date(m+'-01T12:00:00Z');date.setUTCMonth(date.getUTCMonth()-i);const bm=date.toISOString().slice(0,7);rows.push({house:'Casa de ejemplo',user:'ejemplo',key:'ejemplo',month:bm,rent:180000,light:120,lightPrice:150,gas:25,gasPrice:350,base:206750,paid:i?206750:0,payments:i?[{date:bm+'-04',amount:206750}]:[],link:''})}identity={user:'ejemplo',key:'ejemplo'};demonstration=true;try{render();message('')}catch(e){message(e.message,true)}};
</script></body></html>
